name: spotdrop
description: "Spotdrop - Private Crew- & Social-App mit Liquid Glass Design, Notruf & Telefonie"
publish_to: "none"
version: 1.0.6+7

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  cached_network_image: ^3.3.1
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  image_picker: ^1.0.7
  intl: ^0.19.0
  url_launcher: ^6.2.5
  shared_preferences: ^2.2.2
  battery_plus: ^6.0.0
  sensors_plus: ^5.0.0
  flutter_local_notifications: ^17.1.2
  record: ^4.4.4
  audioplayers: ^6.0.0
  path_provider: ^2.1.2
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true