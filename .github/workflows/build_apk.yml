name: Spotdrop CI - Build APK & IPA

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '*.json'
      - 'chat_media/**'
      - 'snaps/**'
      - 'audios/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean and Regenerate Clean Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.spotdrop --project-name=spotdrop

      - name: Configure Kotlin, Core Desugaring & Permissions
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/>' android/app/src/main/AndroidManifest.xml || true
          python3 -c "
          import os
          for p in ['android/settings.gradle', 'android/settings.gradle.kts']:
              if os.path.exists(p):
                  with open(p, 'r') as f:
                      c = f.read()
                  c = c.replace('1.7.10', '1.9.22').replace('1.8.22', '1.9.22')
                  with open(p, 'w') as f:
                      f.write(c)

          for p in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              if os.path.exists(p):
                  with open(p, 'r') as f:
                      c = f.read()
                  c = c.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 23')
                  c = c.replace('minSdkVersion 21', 'minSdkVersion 23')
                  c = c.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
                  c = c.replace('minSdk = 21', 'minSdk = 23')
                  if p.endswith('.kts'):
                      if 'isCoreLibraryDesugaringEnabled' not in c:
                          c = c.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true')
                      if 'desugar_jdk_libs' not in c:
                          c += '\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")\n}\n'
                  else:
                      if 'coreLibraryDesugaringEnabled' not in c:
                          c = c.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true')
                      if 'desugar_jdk_libs' not in c:
                          c += '\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"\n}\n'
                  with open(p, 'w') as f:
                      f.write(c)

          # Fix namespace for AGP 8+ on older plugins (like :record)
          for p in ['android/build.gradle', 'android/build.gradle.kts']:
              if os.path.exists(p):
                  with open(p, 'r') as f:
                      c = f.read()
                  if 'subprojects' not in c:
                      if p.endswith('.kts'):
                          c += '\nsubprojects {\n    afterEvaluate {\n        extensions.findByType<com.android.build.gradle.BaseExtension>()?.apply {\n            if (namespace == null) {\n                namespace = \"com.spotdrop.${project.name}\"\n            }\n        }\n    }\n}\n'
                      else:
                          c += '\nsubprojects {\n    afterEvaluate { project ->\n        if (project.hasProperty(\"android\")) {\n            project.android {\n                if (namespace == null) {\n                    namespace = \"com.spotdrop.${project.name}\"\n                }\n            }\n        }\n    }\n}\n'
                  with open(p, 'w') as f:
                      f.write(c)
          print('Successfully configured Android build files!')
          "

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotdrop-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean and Regenerate Clean iOS Project
        run: |
          rm -rf ios
          flutter create . --platforms=ios --org=com.spotdrop --project-name=spotdrop

      - name: Configure iOS Permissions & Background Modes in Info.plist
        run: |
          plutil -insert NSCameraUsageDescription -string "Spotdrop benötigt Zugriff auf die Kamera für den Snap-Vault." ios/Runner/Info.plist || true
          plutil -insert NSLocationWhenInUseUsageDescription -string "Spotdrop benötigt deinen Standort für die Spot-Map." ios/Runner/Info.plist || true
          plutil -insert NSLocationAlwaysAndWhenInUseUsageDescription -string "Spotdrop benötigt deinen Standort im Hintergrund für Notfallerkennung und Live-Tracking." ios/Runner/Info.plist || true
          plutil -insert NSPhotoLibraryUsageDescription -string "Spotdrop benötigt Zugriff auf deine Fotos für den Upload." ios/Runner/Info.plist || true
          plutil -insert NSMicrophoneUsageDescription -string "Spotdrop benötigt Zugriff auf das Mikrofon für VoIP Audio-Anrufe und Sprachnachrichten." ios/Runner/Info.plist || true

          # Background Modes for VoIP, Audio, Location, Fetch, Remote Notification
          plutil -insert UIBackgroundModes -array ios/Runner/Info.plist || true
          plutil -insert UIBackgroundModes.0 -string "audio" ios/Runner/Info.plist || true
          plutil -insert UIBackgroundModes.1 -string "location" ios/Runner/Info.plist || true
          plutil -insert UIBackgroundModes.2 -string "voip" ios/Runner/Info.plist || true
          plutil -insert UIBackgroundModes.3 -string "fetch" ios/Runner/Info.plist || true
          plutil -insert UIBackgroundModes.4 -string "remote-notification" ios/Runner/Info.plist || true

      - name: Get Dependencies
        run: flutter pub get

      - name: Configure iOS Podfile Deployment Target & Disable Code Signing
        run: |
          python3 -c "
          import os
          p = 'ios/Podfile'
          if os.path.exists(p):
              with open(p, 'r') as f:
                  c = f.read()
              c = c.replace('# platform :ios, \'12.0\'', 'platform :ios, \'13.0\'')
              c = c.replace('# platform :ios, \'11.0\'', 'platform :ios, \'13.0\'')
              c = c.replace('platform :ios, \'12.0\'', 'platform :ios, \'13.0\'')
              c = c.replace('platform :ios, \'11.0\'', 'platform :ios, \'13.0\'')
              if 'platform :ios' not in c:
                  c = 'platform :ios, \'13.0\'\n' + c
              with open(p, 'w') as f:
                  f.write(c)

          # Disable code signing requirement for unsigned sideloading (AltStore / Sideloadly)
          proj = 'ios/Runner.xcodeproj/project.pbxproj'
          if os.path.exists(proj):
              with open(proj, 'r') as f:
                  c = f.read()
              c = c.replace('CODE_SIGN_IDENTITY = \"iPhone Developer\";', 'CODE_SIGN_IDENTITY = \"\"; CODE_SIGNING_REQUIRED = NO; CODE_SIGNING_ALLOWED = NO;')
              c = c.replace('CODE_SIGNING_ALLOWED = YES;', 'CODE_SIGNING_ALLOWED = NO;')
              with open(proj, 'w') as f:
                  f.write(c)
          print('Successfully patched iOS project files!')
          "

      - name: Build iOS App (Release No-Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 Spotdrop.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotdrop-ios-ipa
          path: Spotdrop.ipa
          retention-days: 14
